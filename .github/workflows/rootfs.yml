name: Armbian rootfs cache (arm64 noble cli)

# Builds Armbian's rootfs artifact on its own and parks it in a Release, so the
# board repo's image build can download it instead of debootstrapping a Debian
# userspace from scratch — that stage alone costs 20-40 minutes per build.
#
# ---------------------------------------------------------------------------
# Why this lives in its own repo
#
# The rootfs cache name is
#   rootfs-<ARCH>-<RELEASE>-<cache_type>_<yyyymm>-<AGGREGATED_ROOTFS_HASH>-H<hooks>-B<bash>
# and carries NO board name. Measured on the same armbian/build revision:
#
#   BOARD=hz-evm-rk3588 (board repo overlay) -> de3dd0bda694-H6eccde-Bf1b6db / cli
#   BOARD=rock-5b       (stock Armbian)      -> de3dd0bda694-H6eccde-Bf1b6db / cli
#
# Identical. A rootfs build never touches patch/kernel/ or patch/u-boot/, and even
# a board's PACKAGE_LIST_BOARD lands in the *image*-level package set, not the
# rootfs one. So this is a generic arm64/noble/cli artifact, not a board artifact,
# and it does not belong in the board repo.
#
# ---------------------------------------------------------------------------
# What invalidates a published tarball
#
#   yyyymm                 calendar month rolls over        -> monthly cron below
#   AGGREGATED_ROOTFS_HASH upstream changes the package list
#   B<bash>                hash of lib/functions/rootfs/{create-cache,rootfs-create}.sh
#   cache_type             'cli' != 'minimal' != desktop variants
#
# The pinned SHA below is what keeps B<bash> and the package-list hash stable.
# Bump it and you must re-run this workflow.
#
# The tarball NAME is the whole identity: same name == same cache id, so the
# workflow compares names instead of hashing 244MB of content.
#
# ---------------------------------------------------------------------------
# KEEPALIVE - read this before deleting the last step
#
# GitHub disables scheduled workflows in a PUBLIC repo after 60 days with no
# commit pushed, silently: no email, no failed run, the cron just stops firing.
# Issues / PRs / comments / workflow runs do NOT count as activity - only pushes.
#
# This repo normally gets no commits at all, so without a heartbeat the monthly
# cron would die after two quiet months, the tarball would go stale, and the
# board build would silently fall back to debootstrap (+20-40 min).
#
# The last step pushes an empty commit every run. Since the cron is monthly
# (30d) and the limit is 60d, the chain sustains itself: each run resets the
# timer for the next one.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Userspace release (noble / bookworm / trixie)"
        required: false
        default: "noble"
      minimal:
        description: "true = minimal CLI rootfs. Its cache name differs from the full CLI one."
        type: boolean
        required: false
        default: false
  schedule:
    # The cache name embeds `date +%Y%m`, so a tarball built in September can
    # never be reused in October. Refresh on the 1st of every month.
    # Odd minute on purpose: on-the-hour cron slots queue up behind everyone
    # else's and can be delayed by 5-20 minutes.
    - cron: '17 3 1 * *'

concurrency:
  group: rootfs-cache
  cancel-in-progress: false

env:
  ARMBIAN_BUILD_SHA: 04108a20e5de1c956425b3f5a2a7cba47ba829b8
  BOARD: hz-evm-rk3588
  RELEASE_TAG: armbian-rootfs-cache

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Checkout Armbian build framework (pinned)
        uses: actions/checkout@v7
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_BUILD_SHA }}
          path: armbian-build
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                       /usr/local/lib/android /usr/share/swift 2>/dev/null || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox \
                       google* dotnet* powershell openjdk* moby* || true
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          df -h

      - name: Place board definition
        run: |
          # Only the board conf travels here, and only so the BOARD / parameter
          # surface matches the image repo exactly. Nothing in it affects the
          # rootfs cache id today (see the header comment); a rootfs build never
          # reads patch/.
          mkdir -p armbian-build/config/boards
          cp config/boards/hz-evm-rk3588.conf armbian-build/config/boards/
          ls -l armbian-build/config/boards/hz-evm-rk3588.conf

      - name: Build rootfs artifact
        working-directory: armbian-build
        run: |
          # The `rootfs` CLI subcommand builds (or fetches) just the rootfs
          # artifact and stops. The old ROOT_FS_CREATE_ONLY=yes variable is
          # deprecated and now errors out pointing at this subcommand.
          # sudo is required: debootstrap + chroot + qemu binfmt.
          sudo -E ./compile.sh rootfs \
            BOARD=${{ env.BOARD }} \
            BRANCH=current \
            RELEASE=${{ github.event.inputs.release || 'noble' }} \
            KERNEL_CONFIGURE=no \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=${{ github.event.inputs.minimal == 'true' && 'yes' || 'no' }} \
            EXPERT=yes

      - name: Collect rootfs tarball
        id: collect
        run: |
          ls -lh armbian-build/cache/rootfs/ || true
          files=$(ls armbian-build/cache/rootfs/*.tar.zst 2>/dev/null || true)
          if [ -z "$files" ]; then
            # plain text, NOT a literal "::error::" - the runner echoes every
            # command line and GitHub turns the echoed string into a bogus
            # annotation even when this branch never runs.
            echo "ERROR: no rootfs tarball was produced."
            ls -lhR armbian-build/cache/ || true
            exit 1
          fi
          # This name is the contract with the image repo: it only reuses the
          # tarball when it computes exactly this id for itself.
          for f in $files; do
            echo "rootfs cache file: $(basename "$f")  bytes=$(stat -c%s "$f")"
          done
          echo "name=$(basename $files)" >> "$GITHUB_OUTPUT"

      - name: Compare with what is already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new="${{ steps.collect.outputs.name }}"
          old="$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' 2>/dev/null || true)"
          echo "built    : $new"
          echo "published: ${old:-<none>}"
          if [ "$new" = "$old" ]; then
            echo "=> identical cache id, nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "=> cache id changed, publishing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish rootfs cache to release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Drop the previous asset first. The name embeds yyyymm, so every
          # month is a NEW name and overwrite_files would not replace it:
          # 244MB/month piles up until it hits the 10GB per-release ceiling.
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' \
            | while read -r a; do
                echo "deleting old asset: $a"
                gh release delete-asset "$RELEASE_TAG" "$a" -y
              done
          gh release upload "$RELEASE_TAG" armbian-build/cache/rootfs/*.tar.zst --clobber

      - name: Update release description
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --title "Armbian rootfs cache (armbian/build @ ${ARMBIAN_BUILD_SHA})" \
            --notes "Prebuilt Armbian **arm64 / noble / cli** rootfs tarball, consumed by
          the board image build to skip the 20-40 minute rootfs stage.

          - armbian/build pinned to \`${ARMBIAN_BUILD_SHA}\`
          - cache id \`${{ steps.collect.outputs.name }}\`

          This artifact is **board-independent** - the cache id carries no board
          name. Any arm64 board on RELEASE=noble + full CLI (BUILD_MINIMAL=no)
          can reuse it, provided it pins the same armbian/build revision.

          The cache id embeds year+month, hence the monthly refresh."

      # See the KEEPALIVE note in the header before removing this.
      - name: Heartbeat commit (keeps the monthly cron enabled)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "chore: rootfs cache heartbeat [skip ci] ($(date -u +%Y-%m-%d))"
          git push
